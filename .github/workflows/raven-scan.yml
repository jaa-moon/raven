name: Raven

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Severity threshold (critical|high|medium|low|none)"
        default: "none"

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  security-scan:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      # Dogfooding: Raven assesses its own checkout and uploads the report as an artifact.
      # --yes states that scanning this repository is authorized. This job is report-only
      # (--fail-on none): the repo intentionally ships a deliberately-vulnerable demo target
      # (mock_project/) and secret-shaped test fixtures, so a severity gate would always fail
      # on those fixtures rather than on a real regression. Trigger it manually via
      # workflow_dispatch with a stricter `fail_on` to gate on demand.
      - name: Assess this repository
        run: python raven.py scan . --yes --fail-on "${{ github.event.inputs.fail_on || 'none' }}" -o raven_reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raven-report-${{ github.run_id }}
          path: raven_reports/
