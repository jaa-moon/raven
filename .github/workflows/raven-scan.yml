name: Raven

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      fail_on:
        description: "Severity threshold (critical|high|medium|low|none)"
        default: "high"

env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  security-scan:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      # --yes states that scanning this repository (our own checkout) is authorized.
      - name: Assess this repository
        run: python raven.py scan . --yes --fail-on "${{ github.event.inputs.fail_on || 'high' }}" -o raven_reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raven-report-${{ github.run_id }}
          path: raven_reports/
